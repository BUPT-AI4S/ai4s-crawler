name: Generate paper review action lists
on:
  push:
    branches: [main]
    paths:
      - 'metadata/**/snapshot.json'
      - 'metadata/**/ai4s.json'
      - 'reviews/**'
      - '!reviews/**/actions/**'
      - '!reviews/monitor-data.json'
      - '!reviews/owner-activity.json'
      - '.github/workflows/review-actions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # 高峰时一分钟内会有好几次推送，每次都完整重算并把 1.7MB 的快照重写一遍太浪费：
  # 让新推送直接取代正在跑的这一次，只对最新提交出结果（去抖）。
  group: review-actions
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: crawler
          lfs: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /metadata/*/snapshot.json
            /metadata/*/ai4s.json
            /reviews/venue-review.csv
            /reviews/owners.json
            /reviews/owner-activity.json
            /reviews/monitor-data.json
            /reviews/source-assignments-*.json
            /reviews/*/*.json
            /reviews/*/*/coverage.json
            /reviews/*/*/coverage.csv
            /reviews/*/*/conference-crawl-check.csv
            /reviews/*/feedback/*.json
            /reviews/*/actions/*.md
            /monitor-feedback-format.md
      - uses: actions/checkout@v6
        with:
          repository: BUPT-AI4S/BUPT-AI4S.github.io
          path: monitor-tools
          sparse-checkout: |
            tools/build_owner_activity.py
            tools/build_review_monitor.py
            tools/generate_review_actions.py
            static/review-monitor-guide.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate and commit action lists
        working-directory: crawler
        # 这个仓库在晚上的提交高峰里每分钟都有几个人在推，同一个生成文件在两边都会被改，
        # rebase 必然冲突。所以每次推送失败就丢掉本地改动、同步到最新 main、重新生成再推，最多 5 次。
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 如果 main 已经前进（这次运行已被更新的推送取代），直接退出，别算过期数据。
          git fetch --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::main 已经前进，本次运行放弃，由更新的运行出结果。"
            exit 0
          fi
          generate() {
            python ../monitor-tools/tools/build_owner_activity.py --repo . --output reviews/owner-activity.json || echo '::warning::owner activity unavailable (shallow history)'
            python ../monitor-tools/tools/build_review_monitor.py --source . --output reviews/monitor-data.json
            python ../monitor-tools/tools/generate_review_actions.py --input reviews/monitor-data.json --reviews reviews
            cp ../monitor-tools/static/review-monitor-guide.md monitor-feedback-format.md
          }
          for attempt in 1 2 3 4 5; do
            generate
            git add reviews monitor-feedback-format.md
            if git diff --cached --quiet; then
              echo "没有需要提交的改动。"
              exit 0
            fi
            git commit -m '更新论文审核行动清单'
            if out=$(git push origin HEAD:main 2>&1); then
              echo "第 ${attempt} 次尝试推送成功。"
              exit 0
            fi
            echo "::warning::第 ${attempt} 次推送失败：$(echo "$out" | tail -n 2 | tr '\n' ' ')"
            git fetch origin main
            git reset --hard origin/main
            sleep 5
          done
          echo "::error::连续 5 次推送都被拒绝，本次行动清单没有提交：$(echo "$out" | tail -n 5 | tr '\n' ' ')"
          exit 1
