name: Generate paper review action lists
on:
  push:
    branches: [main]
    paths:
      - 'metadata/**/snapshot.json'
      - 'metadata/**/ai4s.json'
      - 'reviews/**'
      - '!reviews/**/actions/**'
      - '!reviews/monitor-data.json'
      - '!reviews/owner-activity.json'
      - '.github/workflows/review-actions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # 高峰时一分钟内会有好几次推送，每次都完整重算并把 1.7MB 的快照重写一遍太浪费：
  # 让新推送直接取代正在跑的这一次，只对最新提交出结果（去抖）。
  # 注意：这个 bot 只是把 main 的当前状态重算成派生文件，不负责合并别人内容，
  # 所以「只让最后一次落地」不会丢任何人的改动——最后一次读到的是包含全部提交的 main。
  # 若 main 在生成期间又被推进，下面的推送重试会同步到最新 main 重新生成。
  group: review-actions
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: crawler
          lfs: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /metadata/*/snapshot.json
            /metadata/*/ai4s.json
            /reviews/venue-review.csv
            /reviews/owners.json
            /reviews/owner-activity.json
            /reviews/monitor-data.json
            /reviews/source-assignments-*.json
            /reviews/*/*.json
            /reviews/*/*/coverage.json
            /reviews/*/*/coverage.csv
            /reviews/*/*/conference-crawl-check.csv
            /reviews/*/feedback/*.json
            /reviews/*/actions/*.md
            /monitor-feedback-format.md
      - uses: actions/checkout@v6
        with:
          repository: BUPT-AI4S/BUPT-AI4S.github.io
          path: monitor-tools
          sparse-checkout: |
            tools/build_owner_activity.py
            tools/build_review_monitor.py
            tools/generate_review_actions.py
            tools/restore_abstracts.py
            static/review-monitor-guide.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate and commit action lists
        working-directory: crawler
        # 这个仓库在晚上的提交高峰里每分钟都有几个人在推，同一个生成文件在两边都会被改，
        # rebase 必然冲突。所以每次推送失败就丢掉本地改动、同步到最新 main、重新生成再推，最多 5 次。
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          generate() {
            python ../monitor-tools/tools/build_owner_activity.py --repo . --output reviews/owner-activity.json || echo '::warning::owner activity unavailable (shallow history)'
            # 候选文件里的摘要是 papers.json（LFS，体积太大不进 CI）的副本。有人用 papers.json
            # 重新生成 ai4s.json 时，已经回填过的摘要会变回 null，监控就会把做过的工作报成缺失。
            # 这里拿上一版 main 对比，只把「原本有、现在空」的摘要补回来，其余字段不动。
            if git rev-parse --verify -q HEAD~1 >/dev/null; then
              for year_dir in metadata/[0-9][0-9][0-9][0-9]; do
                [ -d "$year_dir" ] || continue
                python ../monitor-tools/tools/restore_abstracts.py --repo . --year "$(basename "$year_dir")" --base-rev HEAD~1 \
                  || echo "::warning::$(basename "$year_dir") 候选摘要恢复失败"
              done
            fi
            python ../monitor-tools/tools/build_review_monitor.py --source . --output reviews/monitor-data.json
            python ../monitor-tools/tools/generate_review_actions.py --input reviews/monitor-data.json --reviews reviews
            cp ../monitor-tools/static/review-monitor-guide.md monitor-feedback-format.md
          }
          for attempt in 1 2 3 4 5; do
            generate
            git add reviews monitor-feedback-format.md metadata
            if git diff --cached --quiet; then
              echo "没有需要提交的改动。"
              exit 0
            fi
            summary='更新论文审核行动清单'
            if git diff --cached --name-only | grep -q '^metadata/.*/ai4s\.json$'; then
              summary='更新论文审核行动清单（恢复被覆盖的候选摘要）'
            fi
            git commit -m "$summary"
            if out=$(git push origin HEAD:main 2>&1); then
              echo "第 ${attempt} 次尝试推送成功。"
              exit 0
            fi
            echo "::warning::第 ${attempt} 次推送失败：$(echo "$out" | tail -n 2 | tr '\n' ' ')"
            git fetch origin main
            git reset --hard origin/main
            sleep 5
          done
          echo "::error::连续 5 次推送都被拒绝，本次行动清单没有提交：$(echo "$out" | tail -n 5 | tr '\n' ' ')"
          exit 1
