name: Generate paper review action lists
on:
  push:
    branches: [main]
    paths:
      - 'metadata/**/snapshot.json'
      - 'metadata/**/ai4s.json'
      - 'reviews/**'
      - '!reviews/**/actions/**'
      - '!reviews/monitor-data.json'
      - '!reviews/owner-activity.json'
      - '.github/workflows/review-actions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: review-actions
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: crawler
          lfs: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /metadata/*/snapshot.json
            /metadata/*/ai4s.json
            /reviews/venue-review.csv
            /reviews/owners.json
            /reviews/owner-activity.json
            /reviews/monitor-data.json
            /reviews/source-assignments-*.json
            /reviews/*/*.json
            /reviews/*/*/coverage.json
            /reviews/*/*/coverage.csv
            /reviews/*/*/conference-crawl-check.csv
            /reviews/*/feedback/*.json
            /reviews/*/actions/*.md
            /monitor-feedback-format.md
      - uses: actions/checkout@v6
        with:
          repository: BUPT-AI4S/BUPT-AI4S.github.io
          path: monitor-tools
          sparse-checkout: |
            tools/build_owner_activity.py
            tools/build_review_monitor.py
            tools/generate_review_actions.py
            static/review-monitor-guide.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate action lists
        run: |
          python monitor-tools/tools/build_owner_activity.py --repo crawler --output crawler/reviews/owner-activity.json || echo '::warning::owner activity unavailable (shallow history)'
          python monitor-tools/tools/build_review_monitor.py --source crawler --output "$RUNNER_TEMP/review-monitor.json"
          python monitor-tools/tools/generate_review_actions.py --input "$RUNNER_TEMP/review-monitor.json" --reviews crawler/reviews
          cp "$RUNNER_TEMP/review-monitor.json" crawler/reviews/monitor-data.json
          cp monitor-tools/static/review-monitor-guide.md crawler/monitor-feedback-format.md
      - name: Commit changed action lists
        working-directory: crawler
        # 这个仓库在晚上的提交高峰里每分钟都有几个人在推，直接 push 会被非快进拒绝，
        # 所以每次失败都 rebase 到最新的 main 再试，最多 5 次。
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git add reviews monitor-feedback-format.md
            if git diff --cached --quiet && [ -z "$(git log origin/main..HEAD --oneline)" ]; then
              echo "没有需要提交的改动。"
              exit 0
            fi
            if [ -n "$(git diff --cached --name-only)" ]; then
              git commit -m '更新论文审核行动清单'
            fi
            if out=$(git push origin HEAD:main 2>&1); then
              echo "第 ${attempt} 次尝试推送成功。"
              exit 0
            fi
            echo "::warning::第 ${attempt} 次推送失败：$(echo "$out" | tail -n 3 | tr '\n' ' ')"
            git fetch origin main
            git rebase --autostash origin/main || git rebase --abort
            sleep 5
          done
          echo "::error::连续 5 次推送都被拒绝，本次行动清单没有提交：$(echo "$out" | tail -n 5 | tr '\n' ' ')"
          exit 1
